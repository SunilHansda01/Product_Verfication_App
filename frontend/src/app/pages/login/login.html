<div class="card shadow border-0 p-4 mx-auto mt-5" style="max-width: 420px; border-radius: 12px;">
  
  <div class="text-center mb-4">
    <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex mb-3 fs-3">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Product Verification</h3>
    <p class="text-muted small">Sign in to access your dashboard</p>
  </div>

  <form (submit)="$event.preventDefault(); login()">
    
    <div class="form-floating mb-3">
      <input 
        type="text" 
        id="usernameInput"
        class="form-control" 
        placeholder="Username"
        [(ngModel)]="username"
        name="username"
        required />
      <label for="usernameInput" class="text-secondary">Username</label>
    </div>

    <div class="form-floating mb-3">
      <input 
        type="password" 
        id="passwordInput"
        class="form-control" 
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required />
      <label for="passwordInput" class="text-secondary">Password</label>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
      Sign In <i class="bi bi-arrow-right small"></i>
    </button>
  </form>

  <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mt-3 border-0 small shadow-sm" role="alert">
    <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
    <div class="fw-medium">{{ errorMessage }}</div>
  </div>

  <div class="text-center mt-4 pt-2 border-top">
    <span class="text-muted small">Don't have an account? </span>
    <a routerLink="/register" class="text-decoration-none fw-semibold small transition-link">
      Create one
    </a>
  </div>

</div>
